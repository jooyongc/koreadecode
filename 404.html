<!DOCTYPE html>

    <style>
        :root { --bg-main:#000; --text-white:#fff; --text-gray:#888; --accent:#CCFF00; }

        .links { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
        .links a {
            display:inline-block; padding:14px 28px; border:1px solid var(--accent); color:var(--accent);
            font-weight:700; text-decoration:none; text-transform:uppercase; letter-spacing:1px; transition:0.3s;
        }
        .links a:hover { background:var(--accent); color:#000; }
        .secondary { margin-top:28px; font-size:0.95rem; }
        .secondary a { color:var(--text-gray); margin:0 10px; }

</head>
